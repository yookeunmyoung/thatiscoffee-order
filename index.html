<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>thatiscoffee 주문표</title><meta property="og:title" content="☕ thatiscoffee 주문표"><meta property="og:description" content="메뉴 골라서 주문 내역 복사 후 단톡방에 붙여 주세요"><style>body{margin:0;background:#f6f2ec;color:#30251e;font-family:system-ui,'Malgun Gothic',sans-serif}.wrap{max-width:650px;margin:auto;padding:18px}h1{margin:5px 0}small,.muted{color:#776e65}.toolbar{position:sticky;top:0;background:#f6f2ec;padding:12px 0;z-index:2}input,textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid #d4c9bb;border-radius:10px;font:inherit}nav{display:flex;gap:6px;overflow:auto;margin-top:10px}nav button{white-space:nowrap}.pill,button{border:1px solid #c7b6a4;background:white;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}.active,.plus,.primary{background:#553a2d;color:white;border-color:#553a2d}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:white;border-radius:12px;padding:12px;margin:7px 0}.name{font-weight:600}.price{font-size:13px;color:#776e65;margin-top:4px}.step{display:flex;align-items:center;gap:10px}.step button{width:35px;height:35px;padding:0;font-size:20px}.step span{min-width:18px;text-align:center}section{background:white;border-radius:14px;padding:15px;margin-top:16px}label{display:block;margin:10px 0}label input[type=checkbox]{width:auto;margin-right:7px}#summary{white-space:pre-line;line-height:1.8}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:15px 0}.actions{display:flex;gap:8px}.actions button{flex:1}footer{font-size:12px;color:#766d64;margin:16px 0 40px}</style></head><body><div class="wrap"><h1>☕ thatiscoffee</h1><div class="muted">함께 쓰는 카페 주문 체크표 · 각자 주문 후 내역 공유</div><div class="toolbar"><input id="search" placeholder="메뉴 검색"><nav id="tabs"></nav></div><div id="items"></div><section><h3>주문 옵션</h3><label><input type="checkbox" id="shot"> 전체 음료 샷 추가 (+500원/잔)</label><label><input type="checkbox" id="oat"> 전체 음료 오트밀크 변경 (+500원/잔)</label><label><input type="checkbox" id="takeout"> 테이크아웃/텀블러 할인 (-500원/음료)</label><textarea id="memo" rows="2" placeholder="개별 HOT/ICE, 시럽, 기타 요청사항"></textarea></section><section><h3>주문 내역</h3><div id="summary">메뉴를 선택해 주세요.</div><div class="total"><span>총 예상금액</span><span id="total">0원</span></div><div class="actions"><button class="primary" onclick="copyOrder()">주문 내역 복사</button><button onclick="shareOrder()">공유하기</button><button onclick="resetOrder()">초기화</button></div></section><footer>사진 속 메뉴를 기준으로 입력했습니다. 반사광으로 가려진 일부 디저트 가격은 확인이 필요합니다. 옵션은 전체 음료에 일괄 적용됩니다. 디카페인 아메리카노는 3,500원+변경비 1,000원 기준입니다. 실제 매장 가격과 할인 적용 조건을 확인하세요. 각 사용자 주문은 서로 자동 합산되지 않습니다.</footer></div><script>
const data=[['커피','에스프레소',3500],['커피','아메리카노 HOT',3500],['커피','아메리카노 ICE',3500],['커피','디카페인 아메리카노 HOT',4500],['커피','디카페인 아메리카노 ICE',4500],['커피','콜드브루 아메리카노',4000],['커피','카페라떼',4000],['커피','플랫화이트',4000],['커피','카푸치노',4000],['커피','바닐라라떼',4500],['커피','연유라떼',4500],['커피','카페모카',4500],['커피','카라멜마끼아또',4500],['커피','아포가토',5500],['스페셜 커피','크림라떼 (아인슈페너)',5500],['스페셜 커피','초당옥수수크림라떼',6000],['스페셜 커피','흑임자크림라떼',6000],['스페셜 커피','썸머라떼',6000],['스페셜 커피','땅콩크림라떼',6500],['차','얼그레이 (홍차)',4500],['차','페퍼민트',4500],['차','루이보스',4500],['차','캐모마일',4500],['차','레몬차',5000],['차','자몽차',5000],['차','유자차',5000],['차','청귤차',5000],['에이드·주스','레몬에이드',5500],['에이드·주스','자몽에이드',5500],['에이드·주스','청귤에이드',5500],['에이드·주스','복숭아에이드',5500],['에이드·주스','망고에이드',5500],['에이드·주스','토마토주스 (+꿀)',6000],['에이드·주스','수박주스 (시즌한정)',6000],['논커피','복숭아 아이스티',4000],['논커피','밀크티',4500],['논커피','달고나라떼',4500],['논커피','초당옥수수라떼',4500],['논커피','녹차라떼',4500],['논커피','초코라떼',4500],['논커피','고구마라떼',5000],['논커피','딸기라떼',6000],['논커피','요거트스무디',6000],['논커피','망고스무디',6000],['디저트','스콘 (버터/에그/초코칩)',4000],['디저트','치즈케이크',6000],['디저트','얼그레이롤케이크',6000],['디저트','크로플 (아이스크림+브라운치즈)',12000]];
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('ko-KR')+'원';let category='전체',qty=Array(data.length).fill(0);const cats=['전체',...new Set(data.map(x=>x[0]))];function render(){ $('tabs').innerHTML=cats.map(c=>`<button class="pill ${category===c?'active':''}" data-cat="${c}">${c}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()});const term=$('search').value.trim();$('items').innerHTML=data.map((m,i)=>((category==='전체'||m[0]===category)&&m[1].includes(term))?`<div class="item"><div><div class="name">${m[1]}</div><div class="price">${fmt(m[2])} · ${m[0]}</div></div><div class="step"><button data-i="${i}" data-d="-1">−</button><span>${qty[i]}</span><button class="plus" data-i="${i}" data-d="1">+</button></div></div>`:'').join('');$('items').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;qty[i]=Math.max(0,qty[i]+(+b.dataset.d));render()});update()};function order(){let lines=data.flatMap((m,i)=>qty[i]?[`${m[1]} × ${qty[i]} = ${fmt(m[2]*qty[i])}`]:[]);let drinks=data.reduce((s,m,i)=>s+(m[0]==='디저트'?0:qty[i]),0),sum=data.reduce((s,m,i)=>s+m[2]*qty[i],0);let opt=[];if($('shot').checked){sum+=500*drinks;opt.push('샷 추가 +'+fmt(500*drinks))}if($('oat').checked){sum+=500*drinks;opt.push('오트밀크 변경 +'+fmt(500*drinks))}if($('takeout').checked){sum-=500*drinks;opt.push('포장/텀블러 할인 -'+fmt(500*drinks))}let memo=$('memo').value.trim();return {lines,opt,sum,memo,txt:'☕ thatiscoffee 주문\n'+[...lines,...opt,memo?'요청: '+memo:'','총 예상금액: '+fmt(sum)].filter(Boolean).join('\n')}}function update(){let o=order();$('summary').textContent=[...o.lines,...o.opt,o.memo?'요청: '+o.memo:''].join('\n')||'메뉴를 선택해 주세요.';$('total').textContent=fmt(o.sum)}async function copyOrder(){try{await navigator.clipboard.writeText(order().txt);alert('주문 내역을 복사했습니다.')}catch(e){prompt('아래 주문 내역을 복사하세요.',order().txt)}}async function shareOrder(){let t=order().txt;if(navigator.share){try{await navigator.share({title:'thatiscoffee 주문',text:t});return}catch(e){if(e.name==='AbortError')return}}copyOrder()}function resetOrder(){if(!confirm('선택한 주문을 모두 초기화할까요?'))return;qty.fill(0);['shot','oat','takeout'].forEach(id=>$(id).checked=false);$('memo').value='';render()}$('search').oninput=render;['shot','oat','takeout','memo'].forEach(id=>$(id).addEventListener('input',update));render();
</script></body></html>
