<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>thatiscoffee 주문표</title><meta property="og:title" content="☕ thatiscoffee 주문표"><meta property="og:description" content="이름 쓰고 메뉴 골라서 주문 보내기를 눌러 주세요"><style>body{margin:0;background:#f6f2ec;color:#30251e;font-family:system-ui,'Malgun Gothic',sans-serif}.wrap{max-width:650px;margin:auto;padding:18px}h1{margin:5px 0}small,.muted{color:#776e65}.toolbar{position:sticky;top:0;background:#f6f2ec;padding:12px 0;z-index:2}input,textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid #d4c9bb;border-radius:10px;font:inherit}nav{display:flex;gap:6px;overflow:auto;margin-top:10px}nav button{white-space:nowrap}.pill,button{border:1px solid #c7b6a4;background:white;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer}.active,.plus,.primary{background:#553a2d;color:white;border-color:#553a2d}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:white;border-radius:12px;padding:12px;margin:7px 0}.name{font-weight:600}.price{font-size:13px;color:#776e65;margin-top:4px}.step{display:flex;align-items:center;gap:10px}.step button{width:35px;height:35px;padding:0;font-size:20px}.step span{min-width:18px;text-align:center}section{background:white;border-radius:14px;padding:15px;margin-top:16px}label{display:block;margin:10px 0}label input[type=checkbox]{width:auto;margin-right:7px}#summary{white-space:pre-line;line-height:1.8}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:15px 0}.actions{display:flex;gap:8px}.actions button{flex:1}.row{display:flex;gap:8px;margin-top:12px}.row input{flex:1}.row button{white-space:nowrap}#sendMsg{font-size:13px;margin-top:6px;min-height:1em}h4{margin:16px 0 6px}.agg{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee5da}.agg b{font-size:18px}.person{padding:10px 0;border-bottom:1px solid #eee5da}.person .top{display:flex;justify-content:space-between;font-weight:600}.person .lines{white-space:pre-line;color:#5c5047;font-size:14px;margin-top:4px;line-height:1.6}.empty{color:#776e65;padding:8px 0}[hidden]{display:none!important}footer{font-size:12px;color:#766d64;margin:16px 0 40px}</style></head><body><div class="wrap"><h1 id="storeTitle"></h1><div class="muted" id="storeSub"></div><div class="toolbar"><input id="search" placeholder="메뉴 검색"><nav id="tabs"></nav></div><div id="items"></div><section><h3 id="optTitle">주문 옵션</h3><div id="optList"></div><textarea id="memo" rows="2" placeholder="기타 요청사항"></textarea></section><section><h3>주문 내역</h3><div id="summary">메뉴를 선택해 주세요.</div><div class="total"><span>총 예상금액</span><span id="total">0원</span></div><div class="actions"><button onclick="copyOrder()">주문 내역 복사</button><button onclick="shareOrder()">공유하기</button><button onclick="resetOrder()">선택 초기화</button></div><div class="row group-only"><input id="who" placeholder="이름 (예: 김철수)" maxlength="30"><button class="primary" id="sendBtn" onclick="sendOrder()">주문 보내기</button></div><div id="sendMsg" class="muted group-only"></div></section><section id="groupBox" class="group-only"><h3>전체 주문 <small id="gstat"></small></h3><h4>메뉴별 합계</h4><div id="byMenu"></div><h4>사람별 주문</h4><div id="byPerson"></div><div class="total"><span>전체 합계</span><span id="gtotal">0원</span></div><div class="actions"><button onclick="loadGroup()">새로고침</button><button class="primary" onclick="copyGroup()">전체 내역 복사</button><button onclick="newRound()">새 모임 시작</button></div><div class="row"><button style="flex:1" onclick="cancelOrder()">내 주문 취소</button></div></section><footer><span id="storeNotes"></span> 이름을 쓰고 "주문 보내기"를 누르면 전체 주문에 모이고, 같은 이름으로 다시 보내면 이전 주문이 바뀝니다.</footer></div><script src="menu.js?v=1792124697341"></script><script>
// 가게·메뉴·옵션은 menu.js에서 읽는다
const data=MENU.items,OPTS=MENU.options||[],SKIP=MENU.optionSkip||[],HEAD=(MENU.icon||'')+' '+MENU.store;
document.title=MENU.store+' 주문표';document.getElementById('storeTitle').textContent=HEAD;document.getElementById('storeSub').textContent=MENU.subtitle||'';document.getElementById('storeNotes').textContent=MENU.notes||'';document.getElementById('memo').placeholder=MENU.memoHint||'기타 요청사항';document.getElementById('optTitle').textContent=OPTS.length?'주문 옵션':'요청사항';document.getElementById('optList').innerHTML=OPTS.map((o,k)=>`<label><input type="checkbox" id="opt${k}"> ${o.label}</label>`).join('');
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('ko-KR')+'원';let category='전체',qty=Array(data.length).fill(0);const cats=['전체',...new Set(data.map(x=>x[0]))];function render(){ $('tabs').innerHTML=cats.map(c=>`<button class="pill ${category===c?'active':''}" data-cat="${c}">${c}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.cat;render()});const term=$('search').value.trim();$('items').innerHTML=data.map((m,i)=>((category==='전체'||m[0]===category)&&m[1].includes(term))?`<div class="item"><div><div class="name">${m[1]}</div><div class="price">${fmt(m[2])} · ${m[0]}</div></div><div class="step"><button data-i="${i}" data-d="-1">−</button><span>${qty[i]}</span><button class="plus" data-i="${i}" data-d="1">+</button></div></div>`:'').join('');$('items').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;qty[i]=Math.max(0,qty[i]+(+b.dataset.d));render()});update()};function optUnits(){return data.reduce((s,m,i)=>s+(SKIP.includes(m[0])?0:qty[i]),0)}function order(){let lines=data.flatMap((m,i)=>qty[i]?[`${m[1]} × ${qty[i]} = ${fmt(m[2]*qty[i])}`]:[]);let units=optUnits(),sum=data.reduce((s,m,i)=>s+m[2]*qty[i],0);let opt=[];OPTS.forEach((o,k)=>{if(units&&$('opt'+k).checked){let v=o.price*units;sum+=v;opt.push(o.name+' '+(v<0?'-':'+')+fmt(Math.abs(v)))}});let memo=$('memo').value.trim();return {lines,opt,sum,memo,txt:HEAD+' 주문\n'+[...lines,...opt,memo?'요청: '+memo:'','총 예상금액: '+fmt(sum)].filter(Boolean).join('\n')}}function update(){let o=order();$('summary').textContent=[...o.lines,...o.opt,o.memo?'요청: '+o.memo:''].join('\n')||'메뉴를 선택해 주세요.';$('total').textContent=fmt(o.sum)}async function copyOrder(){try{await navigator.clipboard.writeText(order().txt);alert('주문 내역을 복사했습니다.')}catch(e){prompt('아래 주문 내역을 복사하세요.',order().txt)}}async function shareOrder(){let t=order().txt;if(navigator.share){try{await navigator.share({title:MENU.store+' 주문',text:t});return}catch(e){if(e.name==='AbortError')return}}copyOrder()}function resetOrder(){if(!confirm('선택한 주문을 모두 초기화할까요?'))return;qty.fill(0);OPTS.forEach((o,k)=>$('opt'+k).checked=false);$('memo').value='';render()}$('search').oninput=render;[...OPTS.map((o,k)=>'opt'+k),'memo'].forEach(id=>$(id).addEventListener('input',update));render();
</script><script>
// 구글 Apps Script 웹 앱 주소 (비어 있으면 주문 모으기 기능을 숨김)
const API_URL='https://script.google.com/macros/s/AKfycbxEUfzQml3QJDycz3InZkNV3T0C5NjrEoXVF8Vh_Tg1YwYJ-O-wMsGL6AfQgm_iCq0l/exec';
const OPT_NAMES=OPTS.map(o=>o.name);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let orders=[];
function myItems(){let it=data.flatMap((m,i)=>qty[i]?[[m[1],qty[i],m[2]]]:[]);let d=optUnits();if(d)OPTS.forEach((o,k)=>{if($('opt'+k).checked)it.push([o.name,d,o.price])});return it}
async function api(body){let r=body?await fetch(API_URL,{method:'POST',body:JSON.stringify(body)}):await fetch(API_URL);let j=await r.json();if(!j.ok)throw new Error(j.error||'서버 오류');return j.orders}
function myName(){let n=$('who').value.trim();if(!n){alert('이름을 입력해 주세요.');$('who').focus()}return n}
async function sendOrder(){let name=myName();if(!name)return;let o=order();if(!o.lines.length){alert('메뉴를 먼저 골라 주세요.');return}try{localStorage.setItem('who',name)}catch(e){}let b=$('sendBtn');b.disabled=true;$('sendMsg').textContent='보내는 중...';try{orders=await api({action:'add',name,items:myItems(),sum:o.sum,memo:o.memo,text:[...o.lines,...o.opt].join('\n')});drawGroup();$('sendMsg').textContent='✅ '+name+'님 주문을 보냈습니다. 다시 보내면 이전 주문이 바뀝니다.'}catch(e){$('sendMsg').textContent='보내지 못했습니다: '+e.message}finally{b.disabled=false}}
async function cancelOrder(){let name=myName();if(!name||!confirm(name+'님 주문을 전체 주문에서 뺄까요?'))return;try{orders=await api({action:'cancel',name});drawGroup();$('sendMsg').textContent=name+'님 주문을 취소했습니다.'}catch(e){alert('취소하지 못했습니다: '+e.message)}}
async function newRound(){if(!confirm('지금까지 모인 주문을 모두 비우고 새 모임을 시작할까요?\n(지난 주문은 구글 시트의 "지난주문" 탭에 보관됩니다)'))return;try{orders=await api({action:'reset'});drawGroup()}catch(e){alert('초기화하지 못했습니다: '+e.message)}}
async function loadGroup(quiet){if(!quiet)$('gstat').textContent='불러오는 중...';try{orders=await api();drawGroup()}catch(e){$('gstat').textContent='불러오지 못했습니다'}}
function aggregate(){let m=new Map();orders.forEach(o=>o.items.forEach(([n,q,p])=>{let a=m.get(n)||{q:0,p};a.q+=q;m.set(n,a)}));let rank=n=>{let i=data.findIndex(x=>x[1]===n);return i<0?999+OPT_NAMES.indexOf(n):i};return [...m].filter(x=>x[1].q).sort((a,b)=>rank(a[0])-rank(b[0]))}
function drawGroup(){let agg=aggregate(),total=orders.reduce((s,o)=>s+o.sum,0),cups=agg.filter(([n])=>!OPT_NAMES.includes(n)).reduce((s,x)=>s+x[1].q,0);$('byMenu').innerHTML=agg.length?agg.map(([n,a])=>`<div class="agg"><span>${esc(n)}</span><b>${a.q}</b></div>`).join(''):'<div class="empty">아직 모인 주문이 없습니다.</div>';$('byPerson').innerHTML=orders.length?orders.map(o=>`<div class="person"><div class="top"><span>${esc(o.name)}</span><span>${fmt(o.sum)}</span></div><div class="lines">${esc(o.text)}${o.memo?'\n요청: '+esc(o.memo):''}</div></div>`).join(''):'<div class="empty">아직 주문한 사람이 없습니다.</div>';$('gtotal').textContent=fmt(total);let t=new Date();$('gstat').textContent=`${orders.length}명 · ${cups}개 · ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')} 기준`}
function groupText(){let agg=aggregate(),total=orders.reduce((s,o)=>s+o.sum,0);return [HEAD+' 전체 주문 ('+orders.length+'명)','','[메뉴별]',...agg.map(([n,a])=>`${n} × ${a.q}`),'','[사람별]',...orders.map(o=>`${o.name} (${fmt(o.sum)}): ${o.text.split('\n').map(l=>l.replace(/ = .*$/,'')).join(', ')}${o.memo?' / 요청: '+o.memo:''}`),'','전체 합계: '+fmt(total)].join('\n')}
async function copyGroup(){let t=groupText();try{await navigator.clipboard.writeText(t);alert('전체 주문 내역을 복사했습니다.')}catch(e){prompt('아래 내용을 복사하세요.',t)}}
if(API_URL){try{$('who').value=localStorage.getItem('who')||''}catch(e){}loadGroup();setInterval(()=>{if(!document.hidden)loadGroup(true)},20000)}else document.querySelectorAll('.group-only').forEach(e=>e.hidden=true);
</script></body></html>
